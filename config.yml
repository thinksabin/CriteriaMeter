# CriteriaMeter — baseline configuration
# Override any value with the corresponding CRITERIAMETER_* environment variable.
# Do NOT commit secrets (secret_key) — set those via env vars in production.

# ── Database ──────────────────────────────────────────────────────────────────
database:
  # Supported types: sqlite | postgresql
  type: sqlite

  # SQLite: path relative to the backend working directory
  # PostgreSQL: postgresql://user:password@host:5432/dbname
  # Override: CRITERIAMETER_DATABASE_URL
  url: sqlite:///./criteriameter.db

# ── HTTP service ──────────────────────────────────────────────────────────────
server:
  # Port the frontend dev server listens on
  # Override: PORT (Vite) or CRITERIAMETER_FRONTEND_PORT
  frontend_port: 3000

  # Port the backend API listens on
  # Override: CRITERIAMETER_BACKEND_PORT
  backend_port: 8000

  # Comma-separated list of origins allowed to call the API
  # Override: CRITERIAMETER_ALLOWED_ORIGINS
  allowed_origins:
    - http://localhost:3000

# ── Authentication ────────────────────────────────────────────────────────────
auth:
  # CHANGE THIS in production — use a long random string
  # Override: CRITERIAMETER_SECRET_KEY
  secret_key: dev-secret-key-change-in-production

  algorithm: HS256

  # Session cookie lifetime in minutes (default: 60)
  token_expire_minutes: 60

  # Set to true in production (HTTPS). Keep false for local HTTP development.
  # Override: CRITERIAMETER_COOKIE_SECURE
  cookie_secure: false

# ── Application ───────────────────────────────────────────────────────────────
app:
  name: CriteriaMeter
  version: "0.1.0"
  # Log level: debug | info | warning | error
  log_level: info

# ── Seed data ─────────────────────────────────────────────────────────────────
# Default admin account created on first startup (INSERT OR IGNORE — idempotent).
# Override credentials via CRITERIAMETER_SEED_ADMIN_EMAIL / _PASSWORD env vars.
# Change the password via the Settings page after first login.
seed:
  admin_user:
    email: admin@admin.com
    password: admin123
    role: admin
