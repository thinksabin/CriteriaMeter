server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* requests to the backend container
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy FastAPI auto-generated API docs
    location /docs {
        proxy_pass       http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass       http://backend:8000/redoc;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass       http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Serve the React SPA — fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the entry HTML so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
